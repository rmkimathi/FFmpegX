<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
            line-height: 1.6;
            color: #333;
            background-color: #FEF7FF; /* Matching app background */
        }
        .header {
            text-align: left;
            margin-bottom: 30px;
        }
        .title {
            font-size: 24px;
            font-weight: bold;
            color: #386567; /* Matching primary color */
        }
        .section {
            margin-bottom: 20px;
        }
        .label {
            font-weight: bold;
            display: block;
        }
        .footer {
            margin-top: 40px;
            font-size: 12px;
            text-align: left;
            color: #777;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="title">FFmpegX</div>
        Version 3.0
    </div>


    <div class="section">
        FFmpegX is a simple graphical user interface for FFmpeg. FFmpeg binary is already built into the App.
    </div>


    <div class="section">
        <span class="label">Output Directory:</span>
        Movies/FFmpegX <br>
        Music/FFmpegX
    </div>


    <div class="section">
        <span class="label">Privacy Policy:</span>
        <a href="https://rmkimathi.github.io/privacy.html">https://rmkimathi.github.io/privacy.html</a>
    </div>

    <div class="footer">
        &copy; 2026 FFmpegX
    </div>
</body>
</html>
